services:
  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rms
      POSTGRES_PASSWORD: rms_dev
      POSTGRES_DB: rms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms -d rms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SQS emulator for the menu image pipeline.
  # Start with: docker compose --profile sqs up -d
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: rms-elasticmq
    restart: unless-stopped
    ports:
      - "9324:9324"
    volumes:
      - ./deploy/local/elasticmq.conf:/opt/elasticmq.conf:ro
    profiles: [sqs]

volumes:
  postgres_data:
