name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://rms:rms_test@localhost:5432/rms_test?schema=public
      TEST_DATABASE_URL: postgresql://rms:rms_test@localhost:5432/rms_test?schema=public
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: rms_test
          POSTGRES_DB: rms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; pinning it here too
      # makes pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      # Node 22 matches the proven local environment; the web unit suite
      # (jsdom 30) fails on Node 20 with "webidl.util.markAsUncloneable is not
      # a function". engines allows >=20, CI runs the version we validate with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Tests run against a fresh database, so migrations must be applied first.
      - name: Validate migrations
        run: pnpm db:migrate:deploy

      - name: Run unit tests
        run: pnpm test

      # API security/contract e2e only: the web Playwright suite needs a full
      # running app stack (browser + API + seeded data) and is tracked as a
      # separate CI follow-up.
      - name: Run API e2e security tests
        run: pnpm --filter @rms/api test:e2e
