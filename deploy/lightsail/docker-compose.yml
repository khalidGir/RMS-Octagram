name: rms-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [private]

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rms-api:${IMAGE_TAG:-staging}
    command:
      - /app/packages/database/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema
      - /app/packages/database/prisma/schema.prisma
    environment: &api-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_CORS_ORIGIN: ${API_CORS_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SAMESITE: none
      TRUST_PROXY: 1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DEFAULT_TIMEZONE: Africa/Addis_Ababa
      DEFAULT_CURRENCY: ETB
      S3_REGION: ${S3_REGION}
      S3_PROOF_BUCKET: ${S3_PROOF_BUCKET}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      MEDIA_CDN_URL: ${MEDIA_CDN_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      SQS_REGION: ${SQS_REGION:-us-east-1}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"
    profiles: [tools]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rms-api:${IMAGE_TAG:-staging}
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [private, edge]

  # Background jobs: payment proof OCR queue and the menu image pipeline
  # (SQS consumer + cleanup sweep). Shares the server-side .env credential
  # mechanism with the API service — no credentials are committed to the repo.
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: rms-worker:${IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DEFAULT_TIMEZONE: Africa/Addis_Ababa
      DEFAULT_CURRENCY: ETB
      S3_REGION: ${S3_REGION}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      SQS_REGION: ${SQS_REGION:-us-east-1}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

networks:
  private:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
